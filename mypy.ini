# mypy.ini: the type check for lib/, the tools and the harness.
#
# CODE_STYLE.md section 5 states the policy (user decision 2026-11-03). The settings follow the
# mentors at the pins of CODE_STYLE.md section 2:
#   PyPSA  d21e028 pyproject.toml lines 170-183: no_implicit_optional, warn_unused_ignores,
#          disallow_untyped_defs and check_untyped_defs. Its global ignore_missing_imports is
#          replaced here by one section per package, and show_error_code_links is left out.
#   linopy 2ace7b3 pyproject.toml lines 168-175: the same two function settings.
#
# A run goes through tools/run_mypy.py (tools/README.md), one pass over `files` below. lib/ is
# flat and holds no __init__.py, so mypy_path makes each module importable by its flat name.
# lib/ is the shared 9-bus library, copied in byte for byte
# (lib/MANIFEST.md), so a finding in lib/ is fixed in a later copy. Tests are out of scope. Paths are relative to the repository root, where
# every run starts.

[mypy]
python_version = 3.10
mypy_path = lib
files = lib,
    tools,
    .claude/hooks,
    .claude/skills/writing-voice/scripts
exclude = (^|/)tests/
cache_dir = tools/.cache/mypy
no_implicit_optional = True
warn_unused_ignores = True
disallow_untyped_defs = True
check_untyped_defs = True

# Packages that ship no type information in the "assume" environment on 2026-11-03. Their objects
# read as Any. pandas-stubs and scipy-stubs are not installed.
[mypy-pandapower.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-pycirclize.*]
ignore_missing_imports = True

[mypy-pymupdf.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True
